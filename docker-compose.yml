services:
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wolfpackunity
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wolfpackunity.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8091}
    networks:
      - app-net
      - claude-net

  frontend:
    build: ./frontend
    ports:
      - "8091:80"
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
  claude-net:
    external: true
